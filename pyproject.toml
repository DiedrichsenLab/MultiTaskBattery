[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "MultiTaskBattery"
description = "A flexible Python toolbox for running multi-domain cognitive and motor tasks during fMRI sessions, built on PsychoPy."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Diedrichsenlab"}]
requires-python = ">=3.10,<3.13"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "psychopy==2026.2.4",
    "pandas",
    "numpy>=1.26.4",
    "scipy",
    "moviepy",
    "imageio",
    "ffmpeg-python",
    "sounddevice",
    "soundfile",
    "pyyaml",
    "questplus",
    "pooch",
    "numba",
    "nibabel",
    "psychopy-sounddevice",
    # wxPython has no Linux wheels on PyPI, so a plain install would try to
    # compile it from source and fail. install.py points pip at the prebuilt
    # wheels for your distro (PIP_FIND_LINKS + PIP_ONLY_BINARY).
    "wxPython; sys_platform == 'linux'",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/diedrichsenlab/MultiTaskBattery"
Documentation = "https://multitaskbattery.readthedocs.io/"
Issues = "https://github.com/diedrichsenlab/MultiTaskBattery/issues"

[project.optional-dependencies]
docs = [
    "numpy",
    "sphinx>=1.4",
    "sphinxcontrib-bibtex",
    "sphinx-copybutton",
    "pandas",
    "matplotlib",
    "ipykernel",
    "nbsphinx",
    "scipy",
    "seaborn",
    "sphinx-rtd-theme",
    "sphinx-design",
]

[tool.setuptools.dynamic]
version = {attr = "MultiTaskBattery.__version__"}

[tool.setuptools.packages.find]
include = ["MultiTaskBattery*"]

[tool.setuptools.package-data]
MultiTaskBattery = ["task_details.json", "task_table.tsv"]
