name: Smoke tests

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # virtual screen (xvfb), a silent sound card (pulseaudio null sink), and PsychoPy's system libs
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb pulseaudio libportaudio2 libasound2t64 libsdl2-2.0-0 \
            libgtk-3-0t64 libnotify4 libglu1-mesa libxkbcommon-x11-0 fonts-ubuntu \
            libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libx11-xcb1 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 ffmpeg
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink

      - name: Install MTB
        run: |
          python -m pip install --upgrade pip
          python install.py
          pip install pytest

      - name: Run smoke tests
        run: xvfb-run -a -s "-screen 0 1024x768x24" python -m pytest tests -v
