name: Publish to PyPI

# Runs when a version tag (e.g. v1.3.0) is pushed: builds the package and uploads it to PyPI.
# PyPI trusts this workflow (trusted publishing), so no password or token is stored.
on:
  push:
    tags: [ "v*" ]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # stop if the tag (v1.3.0) and MultiTaskBattery.__version__ (1.3.0) differ
      - name: Check version
        run: |
          VERSION=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' MultiTaskBattery/__init__.py)
          [ "v$VERSION" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match __version__ $VERSION"; exit 1; }

      - name: Build
        run: |
          python -m pip install build
          python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write   # lets PyPI verify this upload comes from this workflow
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
